buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://maven.zego.im" }
    }
    // react-native-webrtc declares 'org.jitsi:webrtc:124.+' (dynamic range).
    // Pin to the only available 124.x release so Gradle skips the metadata
    // lookup that transiently fails in CI with --no-daemon (no shared cache).
    configurations.all {
        resolutionStrategy {
            force 'org.jitsi:webrtc:124.0.0'
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
