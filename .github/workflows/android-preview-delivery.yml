name: Android PR Test APK

# Called only from the manually dispatched Android Release workflow. Keeping
# this as a reusable workflow shares the release run number/versionCode while
# keeping PR source code isolated from the production signing and delivery job.

on:
  workflow_call:
    inputs:
      pr_number:
        description: Same-repository PR targeting main; open PR builds its head, merged PR builds its merge commit
        required: true
        type: string
    # Signing and publication run in top-level jobs of the caller, because a
    # job inside a called workflow never receives environment secrets: run 175
    # signed the APK and then failed with NoCredentialsError while every
    # reference still looked correct. These outputs are the handoff.
    outputs:
      eligible:
        description: Whether the dispatched PR resolved to a deliverable build
        value: ${{ jobs.resolve.outputs.eligible }}
      pr:
        description: PR number the built APK belongs to
        value: ${{ jobs.resolve.outputs.pr }}
      sha:
        description: Commit the build is proven against
        value: ${{ jobs.resolve.outputs.sha }}
      pr_head_sha:
        description: Verified PR head commit
        value: ${{ jobs.resolve.outputs.pr_head_sha }}
      merged:
        description: Whether the PR is merged
        value: ${{ jobs.resolve.outputs.merged }}
      version:
        description: versionCode assigned to the signed test APK
        value: ${{ jobs.resolve.outputs.version }}
      check:
        description: Check-run the report job completes; empty when uneligible
        value: ${{ jobs.resolve.outputs.check }}
    secrets:
      GEMINI_API_KEY:
        required: false
      YOUTUBE_DATA_API_KEY:
        required: false
      ZEGO_CLOUD_APP_ID:
        required: false
      ZEGO_CLOUD_APP_SIGN:
        required: false
      ANDROID_UPLOAD_KEYSTORE_BASE64:
        required: false
      ANDROID_UPLOAD_STORE_PASSWORD:
        required: false
      ANDROID_UPLOAD_KEY_PASSWORD:
        required: false
      ANDROID_UPLOAD_KEY_ALIAS:
        required: false

permissions:
  contents: read

concurrency:
  group: preview-delivery-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
      pull-requests: read
    outputs:
      eligible: ${{ steps.target.outputs.eligible }}
      pr: ${{ steps.target.outputs.pr }}
      sha: ${{ steps.target.outputs.sha }}
      pr_head_sha: ${{ steps.target.outputs.pr_head_sha }}
      merged: ${{ steps.target.outputs.merged }}
      version: ${{ steps.target.outputs.version }}
      check: ${{ steps.target.outputs.check }}
    steps:
      - name: Check out trusted delivery tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify current PR and build provenance
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          ACTOR: ${{ github.actor }}
          RUN_NUMBER: ${{ github.run_number }}
          REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 scripts/ci/resolve_preview.py

  build-preview:
    needs: resolve
    if: needs.resolve.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    # This job runs PR-controlled app/build scripts. It has no production
    # environment, upload certificate, AWS credentials or SMTP credentials.
    # Mobile runtime values are already distributed in the shipped app.
    permissions:
      contents: read
    steps:
      - name: Check out authorized exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore trusted Gradle dependency cache without saving PR state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: preview-gradle-readonly-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: setup-java-${{ runner.os }}-x64-gradle-
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Prepare CI env file
        id: prepare_env
        env:
          SELECTED_ENVFILE: .env.production
          BACKEND_ORIGIN_VALUE: ${{ vars.BACKEND_ORIGIN }}
          API_BASE_URL_VALUE: ${{ vars.API_BASE_URL }}
          SOCKET_URL_VALUE: ${{ vars.SOCKET_URL }}
          SHARE_BASE_URL_VALUE: ${{ vars.SHARE_BASE_URL }}
          GOOGLE_WEB_CLIENT_ID_VALUE: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID_VALUE: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
          YOUTUBE_DATA_API_KEY_VALUE: ${{ vars.YOUTUBE_DATA_API_KEY != '' && vars.YOUTUBE_DATA_API_KEY || secrets.YOUTUBE_DATA_API_KEY
            }}
          GEMINI_API_KEY_VALUE: ${{ secrets.GEMINI_API_KEY }}
          ZEGO_CLOUD_APP_ID_VALUE: ${{ vars.ZEGO_CLOUD_APP_ID != '' && vars.ZEGO_CLOUD_APP_ID || secrets.ZEGO_CLOUD_APP_ID }}
          ZEGO_CLOUD_APP_SIGN_VALUE: ${{ secrets.ZEGO_CLOUD_APP_SIGN }}
        run: "fallback_example=\"${SELECTED_ENVFILE}.example\"\n\nif [ -f \"$SELECTED_ENVFILE\" ]; then\n  cp \"$SELECTED_ENVFILE\"\
          \ .env.ci\nelif [ -f \"$fallback_example\" ]; then\n  cp \"$fallback_example\" .env.ci\nelse\n  : > .env.ci\nfi\n\nupsert_env()\
          \ {\n  key=\"$1\"\n  value=\"$2\"\n\n  if [ -z \"$value\" ]; then\n    return\n  fi\n\n  grep -v \"^${key}=\" .env.ci\
          \ > .env.ci.tmp || true\n  printf \"%s=%s\\n\" \"$key\" \"$value\" >> .env.ci.tmp\n  mv .env.ci.tmp .env.ci\n}\n\nupsert_env\
          \ \"BACKEND_ORIGIN\" \"$BACKEND_ORIGIN_VALUE\"\nupsert_env \"API_BASE_URL\" \"$API_BASE_URL_VALUE\"\nupsert_env \"SOCKET_URL\"\
          \ \"$SOCKET_URL_VALUE\"\nupsert_env \"SHARE_BASE_URL\" \"$SHARE_BASE_URL_VALUE\"\nupsert_env \"GOOGLE_WEB_CLIENT_ID\"\
          \ \"$GOOGLE_WEB_CLIENT_ID_VALUE\"\nupsert_env \"GOOGLE_IOS_CLIENT_ID\" \"$GOOGLE_IOS_CLIENT_ID_VALUE\"\nupsert_env \"\
          YOUTUBE_DATA_API_KEY\" \"$YOUTUBE_DATA_API_KEY_VALUE\"\nupsert_env \"GEMINI_API_KEY\" \"$GEMINI_API_KEY_VALUE\"\nupsert_env\
          \ \"ZEGO_CLOUD_APP_ID\" \"$ZEGO_CLOUD_APP_ID_VALUE\"\nupsert_env \"ZEGO_CLOUD_APP_SIGN\" \"$ZEGO_CLOUD_APP_SIGN_VALUE\"\
          \n\nforbidden_mobile_keys=(\n  RAZORPAY_KEY_SECRET\n  RAZORPAY_WEBHOOK_SECRET\n  SPOTIFY_CLIENT_SECRET\n  JAMENDO_CLIENT_SECRET\n\
          )\nfor key in \"${forbidden_mobile_keys[@]}\"; do\n  if grep -q \"^${key}=\" .env.ci; then\n    echo \"Server-only credential\
          \ must not be embedded in the Android app: ${key}\" >&2\n    exit 1\n  fi\ndone\n\necho \"envfile=.env.ci\" >> \"$GITHUB_OUTPUT\"\
          \n"
      - name: Validate production env values
        env:
          ENVFILE_VALUE: ${{ steps.prepare_env.outputs.envfile }}
          BACKEND_ORIGIN_EXPECTED: https://api.aline2.com
          SHARE_BASE_URL_EXPECTED: https://aline2.com
        run: 'test -f "$ENVFILE_VALUE"

          grep -q "^BACKEND_ORIGIN=${BACKEND_ORIGIN_EXPECTED}$" "$ENVFILE_VALUE"

          grep -q "^SHARE_BASE_URL=${SHARE_BASE_URL_EXPECTED}$" "$ENVFILE_VALUE"

          grep -Eq ''^YOUTUBE_DATA_API_KEY=.{10,}$'' "$ENVFILE_VALUE"

          grep -Eq ''^GEMINI_API_KEY=.{10,}$'' "$ENVFILE_VALUE"

          grep -Eq ''^ZEGO_CLOUD_APP_ID=.{3,}$'' "$ENVFILE_VALUE"

          grep -Eq ''^ZEGO_CLOUD_APP_SIGN=.{10,}$'' "$ENVFILE_VALUE"

          '
      - name: Prepare disposable signing and version
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          chmod +x android/gradlew
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > android/local.properties
          python3 - <<'VERSION'
          import os, re
          from pathlib import Path
          p = Path('android/app/build.gradle')
          text, count = re.subn(r'(\bversionCode\s+)\d+', lambda m: m[1] + os.environ['VERSION'], p.read_text(), count=1)
          assert count == 1
          p.write_text(text)
          VERSION
          keytool -genkeypair -keystore "$RUNNER_TEMP/preview.keystore" -storepass preview-only \
            -keypass preview-only -alias preview -keyalg RSA -keysize 2048 -validity 2 \
            -dname 'CN=Aline2 disposable PR build'
          plugin_file=node_modules/@react-native/gradle-plugin/settings.gradle.kts
          sed -i '/org.gradle.toolchains.foojay-resolver-convention/s/^/\/\/ /' "$plugin_file"
      - name: Build production-configured PR APK
        env:
          ENVFILE: .env.ci
          ANDROID_UPLOAD_CREDENTIALS_FILE: /nonexistent/preview-credentials
          ANDROID_UPLOAD_STORE_FILE: ${{ runner.temp }}/preview.keystore
          ANDROID_UPLOAD_STORE_PASSWORD: preview-only
          ANDROID_UPLOAD_KEY_PASSWORD: preview-only
          ANDROID_UPLOAD_KEY_ALIAS: preview
        run: bash scripts/build-android-release.sh apk
      - name: Collect input APK
        run: |
          mkdir preview
          cp android/app/build/outputs/apk/release/app-release.apk preview/input.apk
      - name: Transfer APK to isolated signing job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-preview-input
          path: preview/input.apk
          retention-days: 1
          if-no-files-found: error

