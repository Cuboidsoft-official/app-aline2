name: Android Preview Delivery

# This pipeline is exercised through a controlled PR before its APK check is required.

on:
  workflow_run:
    workflows: [Android Release]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: preview-delivery-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  resolve:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: write
    outputs:
      eligible: ${{ steps.target.outputs.eligible }}
      pr: ${{ steps.target.outputs.pr }}
      sha: ${{ steps.target.outputs.sha }}
      version: ${{ steps.target.outputs.version }}
      check: ${{ steps.target.outputs.check }}
    steps:
      - name: Check out trusted delivery tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify current PR and build provenance
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 scripts/ci/resolve_preview.py

  build-preview:
    needs: resolve
    if: needs.resolve.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: production
    # Untrusted build scripts get only mobile runtime config already shipped
    # in the APK, and a disposable signing key. No AWS, SMTP or upload key.
    permissions:
      contents: read
    steps:
      - name: Check out authorized exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and validate
        run: |
          npm ci
          npm run typecheck
          npm test -- --runInBand
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Prepare CI env file
        id: prepare_env
        env:
          SELECTED_ENVFILE: .env.production
          BACKEND_ORIGIN_VALUE: ${{ vars.BACKEND_ORIGIN != '' && vars.BACKEND_ORIGIN || secrets.BACKEND_ORIGIN }}
          API_BASE_URL_VALUE: ${{ vars.API_BASE_URL != '' && vars.API_BASE_URL || secrets.API_BASE_URL }}
          SOCKET_URL_VALUE: ${{ vars.SOCKET_URL != '' && vars.SOCKET_URL || secrets.SOCKET_URL }}
          SHARE_BASE_URL_VALUE: ${{ vars.SHARE_BASE_URL != '' && vars.SHARE_BASE_URL || secrets.SHARE_BASE_URL }}
          GOOGLE_WEB_CLIENT_ID_VALUE: ${{ vars.GOOGLE_WEB_CLIENT_ID != '' && vars.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID
            }}
          GOOGLE_IOS_CLIENT_ID_VALUE: ${{ vars.GOOGLE_IOS_CLIENT_ID != '' && vars.GOOGLE_IOS_CLIENT_ID || secrets.GOOGLE_IOS_CLIENT_ID
            }}
          YOUTUBE_DATA_API_KEY_VALUE: ${{ vars.YOUTUBE_DATA_API_KEY != '' && vars.YOUTUBE_DATA_API_KEY || secrets.YOUTUBE_DATA_API_KEY
            }}
          GEMINI_API_KEY_VALUE: ${{ secrets.GEMINI_API_KEY }}
          ZEGO_CLOUD_APP_ID_VALUE: ${{ vars.ZEGO_CLOUD_APP_ID != '' && vars.ZEGO_CLOUD_APP_ID || secrets.ZEGO_CLOUD_APP_ID }}
          ZEGO_CLOUD_APP_SIGN_VALUE: ${{ secrets.ZEGO_CLOUD_APP_SIGN }}
        run: "fallback_example=\"${SELECTED_ENVFILE}.example\"\n\nif [ -f \"$SELECTED_ENVFILE\" ]; then\n  cp \"$SELECTED_ENVFILE\"\
          \ .env.ci\nelif [ -f \"$fallback_example\" ]; then\n  cp \"$fallback_example\" .env.ci\nelse\n  : > .env.ci\nfi\n\nupsert_env()\
          \ {\n  key=\"$1\"\n  value=\"$2\"\n\n  if [ -z \"$value\" ]; then\n    return\n  fi\n\n  grep -v \"^${key}=\" .env.ci\
          \ > .env.ci.tmp || true\n  printf \"%s=%s\\n\" \"$key\" \"$value\" >> .env.ci.tmp\n  mv .env.ci.tmp .env.ci\n}\n\nupsert_env\
          \ \"BACKEND_ORIGIN\" \"$BACKEND_ORIGIN_VALUE\"\nupsert_env \"API_BASE_URL\" \"$API_BASE_URL_VALUE\"\nupsert_env \"SOCKET_URL\"\
          \ \"$SOCKET_URL_VALUE\"\nupsert_env \"SHARE_BASE_URL\" \"$SHARE_BASE_URL_VALUE\"\nupsert_env \"GOOGLE_WEB_CLIENT_ID\"\
          \ \"$GOOGLE_WEB_CLIENT_ID_VALUE\"\nupsert_env \"GOOGLE_IOS_CLIENT_ID\" \"$GOOGLE_IOS_CLIENT_ID_VALUE\"\nupsert_env \"\
          YOUTUBE_DATA_API_KEY\" \"$YOUTUBE_DATA_API_KEY_VALUE\"\nupsert_env \"GEMINI_API_KEY\" \"$GEMINI_API_KEY_VALUE\"\nupsert_env\
          \ \"ZEGO_CLOUD_APP_ID\" \"$ZEGO_CLOUD_APP_ID_VALUE\"\nupsert_env \"ZEGO_CLOUD_APP_SIGN\" \"$ZEGO_CLOUD_APP_SIGN_VALUE\"\
          \n\nforbidden_mobile_keys=(\n  RAZORPAY_KEY_SECRET\n  RAZORPAY_WEBHOOK_SECRET\n  SPOTIFY_CLIENT_SECRET\n  JAMENDO_CLIENT_SECRET\n\
          )\nfor key in \"${forbidden_mobile_keys[@]}\"; do\n  if grep -q \"^${key}=\" .env.ci; then\n    echo \"Server-only credential\
          \ must not be embedded in the Android app: ${key}\" >&2\n    exit 1\n  fi\ndone\n\necho \"envfile=.env.ci\" >> \"$GITHUB_OUTPUT\"\
          \n"
      - name: Validate production env values
        env:
          ENVFILE_VALUE: ${{ steps.prepare_env.outputs.envfile }}
          BACKEND_ORIGIN_EXPECTED: https://api.aline2.com
          SHARE_BASE_URL_EXPECTED: https://aline2.com
        run: 'test -f "$ENVFILE_VALUE"

          grep -q "^BACKEND_ORIGIN=${BACKEND_ORIGIN_EXPECTED}$" "$ENVFILE_VALUE"

          grep -q "^SHARE_BASE_URL=${SHARE_BASE_URL_EXPECTED}$" "$ENVFILE_VALUE"

          grep -Eq ''^YOUTUBE_DATA_API_KEY=.{10,}$'' "$ENVFILE_VALUE"

          grep -Eq ''^GEMINI_API_KEY=.{10,}$'' "$ENVFILE_VALUE"

          grep -Eq ''^ZEGO_CLOUD_APP_ID=.{3,}$'' "$ENVFILE_VALUE"

          grep -Eq ''^ZEGO_CLOUD_APP_SIGN=.{10,}$'' "$ENVFILE_VALUE"

          '
      - name: Prepare disposable signing and version
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          chmod +x android/gradlew
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > android/local.properties
          python3 - <<'VERSION'
          import os, re
          from pathlib import Path
          p = Path('android/app/build.gradle')
          text, count = re.subn(r'(\bversionCode\s+)\d+', lambda m: m[1] + os.environ['VERSION'], p.read_text(), count=1)
          assert count == 1
          p.write_text(text)
          VERSION
          keytool -genkeypair -keystore "$RUNNER_TEMP/preview.keystore" -storepass preview-only \
            -keypass preview-only -alias preview -keyalg RSA -keysize 2048 -validity 2 \
            -dname 'CN=Aline2 disposable PR build'
          plugin_file=node_modules/@react-native/gradle-plugin/settings.gradle.kts
          sed -i '/org.gradle.toolchains.foojay-resolver-convention/s/^/\/\/ /' "$plugin_file"
      - name: Build production-configured PR APK
        env:
          ENVFILE: .env.ci
          ANDROID_UPLOAD_CREDENTIALS_FILE: /nonexistent/preview-credentials
          ANDROID_UPLOAD_STORE_FILE: ${{ runner.temp }}/preview.keystore
          ANDROID_UPLOAD_STORE_PASSWORD: preview-only
          ANDROID_UPLOAD_KEY_PASSWORD: preview-only
          ANDROID_UPLOAD_KEY_ALIAS: preview
        run: bash scripts/build-android-release.sh apk
      - name: Collect input APK
        run: |
          mkdir preview
          cp android/app/build/outputs/apk/release/app-release.apk preview/input.apk
      - name: Transfer APK to isolated signing job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-preview-input
          path: preview/input.apk
          retention-days: 1
          if-no-files-found: error

  deliver:
    needs: [resolve, build-preview]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      # No PR scripts execute in this signing/delivery runner.
      - name: Check out trusted delivery tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download built APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pr-preview-input
          path: preview
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android verification tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: build-tools;36.0.0
      - name: Verify input APK
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          test -f preview/input.apk
          test ! -L preview/input.apk
          python3 scripts/ci/verify_apk.py preview/input.apk \
            --tools "$ANDROID_SDK_ROOT/build-tools/36.0.0" --version-code "$VERSION"
      - name: Sign and verify test APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          KEY_ALIAS: ${{ vars.ANDROID_UPLOAD_KEY_ALIAS != '' && vars.ANDROID_UPLOAD_KEY_ALIAS || secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/upload.keystore"' EXIT
          printf '%s' "$KEYSTORE" | tr -d '\r\n\t ' | base64 -d > "$RUNNER_TEMP/upload.keystore"
          chmod 600 "$RUNNER_TEMP/upload.keystore"
          tools="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/upload.keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out preview/Aline2-PR-test.apk preview/input.apk
          cert="$("$tools/apksigner" verify --print-certs preview/Aline2-PR-test.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test "$cert" = '34553881d7a4065708f8c871b4d477919a046afdd73c06b5611adf0475132999'
          python3 scripts/ci/verify_apk.py preview/Aline2-PR-test.apk --tools "$tools" --version-code "$VERSION"
          cd preview
          sha256sum Aline2-PR-test.apk > Aline2-PR-test.apk.sha256
      - name: Save signed test APK
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Aline2-PR-${{ needs.resolve.outputs.pr }}-${{ needs.resolve.outputs.sha }}
          path: |
            preview/Aline2-PR-test.apk
            preview/Aline2-PR-test.apk.sha256
          retention-days: 7
          if-no-files-found: error
      - name: Publish downloads in PR and run summary
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.resolve.outputs.pr }}
          SHA: ${{ needs.resolve.outputs.sha }}
          VERSION: ${{ needs.resolve.outputs.version }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          PRIVATE_RELEASES_BUCKET: ${{ vars.PRIVATE_RELEASES_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.RELEASE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_AWS_SECRET_ACCESS_KEY }}
        run: python3 scripts/ci/publish_preview.py

  report:
    if: always() && needs.resolve.outputs.check != ''
    needs: [resolve, build-preview, deliver]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      checks: write
    steps:
      - name: Report exact-head APK result
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CHECK: ${{ needs.resolve.outputs.check }}
          ELIGIBLE: ${{ needs.resolve.outputs.eligible }}
          BUILD_RESULT: ${{ needs.build-preview.result }}
          DELIVERY_RESULT: ${{ needs.deliver.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          result=failure
          if [ "$ELIGIBLE" != true ] || { [ "$BUILD_RESULT" = success ] && [ "$DELIVERY_RESULT" = success ]; }; then result=success; fi
          if [ "$BUILD_RESULT" = cancelled ] || [ "$DELIVERY_RESULT" = cancelled ]; then result=cancelled; fi
          gh api --method PATCH "repos/$REPO/check-runs/$CHECK" \
            -f status=completed -f conclusion="$result" -f details_url="$RUN_URL" > /dev/null
