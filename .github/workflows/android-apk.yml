name: Android Release

on:
  push:
    branches:
      - main
    paths:
      - '.env.production.example'
      - 'android/**'
      - 'src/**'
      - 'App.tsx'
      - 'app.json'
      - 'babel.config.js'
      - 'google-services.json'
      - 'index.js'
      - 'metro.config.js'
      - 'package*.json'
      - 'react-native.config.js'
      - 'scripts/build-android-release.sh'
      - 'scripts/ci/filter_android_autolinking.js'
      - 'scripts/ci/list_android_codegen_prewarm_tasks.js'
      - 'scripts/patch-*.js'
  workflow_dispatch:
    inputs:
      release_profile:
        description: Release profile to build
        required: true
        default: standard
        type: choice
        options:
          - standard
          - arm64
      deliver:
        description: Email secure APK/AAB delivery links to Cuboidsoft
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: android-production
  cancel-in-progress: false

jobs:
  release-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PRIVATE_RELEASES_BUCKET: ${{ vars.PRIVATE_RELEASES_BUCKET }}
      BACKEND_ORIGIN_EXPECTED: https://api.aline2.com
      SHARE_BASE_URL_EXPECTED: https://aline2.com
      ANDROID_UPLOAD_CERT_SHA256_EXPECTED: "34553881d7a4065708f8c871b4d477919a046afdd73c06b5611adf0475132999"
      ANDROID_PLATFORM_VERSION: "36"
      ANDROID_BUILD_TOOLS_VERSION: "36.0.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reject sensitive mobile files
        run: bash scripts/ci/check-no-sensitive-mobile-files.sh

      - name: Free disk space on runner
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo mkdir -p /usr/local/lib/android
          sudo chown -R $USER:$USER /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          echo "Disk space after cleanup:"
          df -h

      - name: Derive release metadata
        id: meta
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Production Android releases must run from main" >&2
            exit 1
          fi

          release_profile="standard"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_profile }}" ]; then
            release_profile="${{ github.event.inputs.release_profile }}"
          fi

          deliver_release="false"
          if [ "${{ github.event_name }}" = "push" ]; then
            deliver_release="true"
          elif [ "${{ github.event.inputs.deliver }}" = "true" ]; then
            deliver_release="true"
          fi

          short_sha="$(git rev-parse --short=7 HEAD)"
          release_date="$(date -u +%Y%m%d)"
          app_version="$(node -p "require('./package.json').version")"
          android_version_name="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' android/app/build.gradle | head -n 1)"
          if [ -z "$android_version_name" ] || [ "$android_version_name" != "$app_version" ]; then
            echo "package.json version and Android versionName must match" >&2
            exit 1
          fi

          case "$release_profile" in
            arm64)
              release_name="Aline2-v${app_version}-${release_date}-${short_sha}-r${GITHUB_RUN_NUMBER}-arm64"
              apk_name="app-arm64-v8a-release.apk"
              apk_mode="apk-arm64"
              build_aab="false"
              deliver_release="false"
              ;;
            *)
              release_name="Aline2-v${app_version}-${release_date}-${short_sha}-r${GITHUB_RUN_NUMBER}"
              apk_name="${release_name}.apk"
              apk_mode="apk"
              build_aab="true"
              ;;
          esac

          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "release_date=$release_date" >> "$GITHUB_OUTPUT"
          echo "release_profile=$release_profile" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
          echo "artifact_name=android-release-${release_name}" >> "$GITHUB_OUTPUT"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"
          echo "apk_mode=$apk_mode" >> "$GITHUB_OUTPUT"
          echo "build_aab=$build_aab" >> "$GITHUB_OUTPUT"
          echo "deliver_release=$deliver_release" >> "$GITHUB_OUTPUT"
          echo "aab_name=${release_name}.aab" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-${ANDROID_PLATFORM_VERSION}" "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

      - name: Expose Android build tools
        run: |
          build_tools_dir="${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS_VERSION}"
          echo "$build_tools_dir" >> "$GITHUB_PATH"
          "$build_tools_dir/apksigner" version

      - name: Install dependencies
        run: npm ci

      - name: Validate deployment configuration
        if: steps.meta.outputs.deliver_release == 'true'
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          required_vars=(
            AWS_REGION
            PRIVATE_RELEASES_BUCKET
          )
          for key in "${required_vars[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing workflow variable: $key" >&2
              exit 1
            fi
          done

          required_secrets=(
            AWS_ROLE_TO_ASSUME
            SMTP_HOST
            SMTP_PORT
            SMTP_USERNAME
            SMTP_PASSWORD
            SMTP_FROM
          )
          for key in "${required_secrets[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing workflow secret: $key" >&2
              exit 1
            fi
          done

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint baseline
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Record existing lint debt
        if: always() && steps.lint.outcome == 'failure'
        run: |
          {
            echo "## Lint debt"
            echo
            echo "Lint remains advisory until the existing application errors are resolved."
            echo "Type checking, tests, signing validation, and artifact verification remain blocking."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests
        run: npm test -- --runInBand

      - name: Prepare CI env file
        id: prepare_env
        env:
          SELECTED_ENVFILE: .env.production
          BACKEND_ORIGIN_VALUE: ${{ vars.BACKEND_ORIGIN != '' && vars.BACKEND_ORIGIN || secrets.BACKEND_ORIGIN }}
          API_BASE_URL_VALUE: ${{ vars.API_BASE_URL != '' && vars.API_BASE_URL || secrets.API_BASE_URL }}
          SOCKET_URL_VALUE: ${{ vars.SOCKET_URL != '' && vars.SOCKET_URL || secrets.SOCKET_URL }}
          SHARE_BASE_URL_VALUE: ${{ vars.SHARE_BASE_URL != '' && vars.SHARE_BASE_URL || secrets.SHARE_BASE_URL }}
          GOOGLE_WEB_CLIENT_ID_VALUE: ${{ vars.GOOGLE_WEB_CLIENT_ID != '' && vars.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID_VALUE: ${{ vars.GOOGLE_IOS_CLIENT_ID != '' && vars.GOOGLE_IOS_CLIENT_ID || secrets.GOOGLE_IOS_CLIENT_ID }}
          YOUTUBE_DATA_API_KEY_VALUE: ${{ vars.YOUTUBE_DATA_API_KEY != '' && vars.YOUTUBE_DATA_API_KEY || secrets.YOUTUBE_DATA_API_KEY }}
          GEMINI_API_KEY_VALUE: ${{ secrets.GEMINI_API_KEY }}
          ZEGO_CLOUD_APP_ID_VALUE: ${{ vars.ZEGO_CLOUD_APP_ID != '' && vars.ZEGO_CLOUD_APP_ID || secrets.ZEGO_CLOUD_APP_ID }}
          ZEGO_CLOUD_APP_SIGN_VALUE: ${{ secrets.ZEGO_CLOUD_APP_SIGN }}
        run: |
          fallback_example="${SELECTED_ENVFILE}.example"

          if [ -f "$SELECTED_ENVFILE" ]; then
            cp "$SELECTED_ENVFILE" .env.ci
          elif [ -f "$fallback_example" ]; then
            cp "$fallback_example" .env.ci
          else
            : > .env.ci
          fi

          upsert_env() {
            key="$1"
            value="$2"

            if [ -z "$value" ]; then
              return
            fi

            grep -v "^${key}=" .env.ci > .env.ci.tmp || true
            printf "%s=%s\n" "$key" "$value" >> .env.ci.tmp
            mv .env.ci.tmp .env.ci
          }

          upsert_env "BACKEND_ORIGIN" "$BACKEND_ORIGIN_VALUE"
          upsert_env "API_BASE_URL" "$API_BASE_URL_VALUE"
          upsert_env "SOCKET_URL" "$SOCKET_URL_VALUE"
          upsert_env "SHARE_BASE_URL" "$SHARE_BASE_URL_VALUE"
          upsert_env "GOOGLE_WEB_CLIENT_ID" "$GOOGLE_WEB_CLIENT_ID_VALUE"
          upsert_env "GOOGLE_IOS_CLIENT_ID" "$GOOGLE_IOS_CLIENT_ID_VALUE"
          upsert_env "YOUTUBE_DATA_API_KEY" "$YOUTUBE_DATA_API_KEY_VALUE"
          upsert_env "GEMINI_API_KEY" "$GEMINI_API_KEY_VALUE"
          upsert_env "ZEGO_CLOUD_APP_ID" "$ZEGO_CLOUD_APP_ID_VALUE"
          upsert_env "ZEGO_CLOUD_APP_SIGN" "$ZEGO_CLOUD_APP_SIGN_VALUE"

          forbidden_mobile_keys=(
            RAZORPAY_KEY_SECRET
            RAZORPAY_WEBHOOK_SECRET
            SPOTIFY_CLIENT_SECRET
            JAMENDO_CLIENT_SECRET
          )
          for key in "${forbidden_mobile_keys[@]}"; do
            if grep -q "^${key}=" .env.ci; then
              echo "Server-only credential must not be embedded in the Android app: ${key}" >&2
              exit 1
            fi
          done

          echo "envfile=.env.ci" >> "$GITHUB_OUTPUT"

      

      - name: Validate production env values
        env:
          ENVFILE_VALUE: ${{ steps.prepare_env.outputs.envfile }}
        run: |
          test -f "$ENVFILE_VALUE"
          grep -q "^BACKEND_ORIGIN=${BACKEND_ORIGIN_EXPECTED}$" "$ENVFILE_VALUE"
          grep -q "^SHARE_BASE_URL=${SHARE_BASE_URL_EXPECTED}$" "$ENVFILE_VALUE"
          grep -Eq '^YOUTUBE_DATA_API_KEY=.{10,}$' "$ENVFILE_VALUE"
          grep -Eq '^GEMINI_API_KEY=.{10,}$' "$ENVFILE_VALUE"
          grep -Eq '^ZEGO_CLOUD_APP_ID=.{3,}$' "$ENVFILE_VALUE"
          grep -Eq '^ZEGO_CLOUD_APP_SIGN=.{10,}$' "$ENVFILE_VALUE"

      - name: Calculate Android version code
        if: steps.meta.outputs.build_aab == 'true'
        id: android_version
        run: |
          set -euo pipefail

          # GitHub Actions workflow run number is monotonically increasing
          # for this workflow. Start well above existing Play version codes.
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))

          echo "GitHub workflow run number: ${GITHUB_RUN_NUMBER}"
          echo "Android versionCode: ${VERSION_CODE}"

          if [ "${VERSION_CODE}" -le 31 ]; then
            echo "Generated versionCode is invalid" >&2
            exit 1
          fi

          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Apply Android version code
        if: steps.meta.outputs.build_aab == 'true'
        env:
          VERSION_CODE: ${{ steps.android_version.outputs.version_code }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          version_code = os.environ["VERSION_CODE"]

          updated, count = re.subn(
              r'(\bversionCode\s+)\d+',
              rf'\g<1>{version_code}',
              text,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  "Could not find exactly one Android versionCode in android/app/build.gradle"
              )

          path.write_text(updated)

          print(f"Android versionCode set to {version_code}")
          PY

          grep -n "versionCode" android/app/build.gradle

      - name: Patch React Native Gradle toolchain resolver for CI
        run: |
          plugin_file="node_modules/@react-native/gradle-plugin/settings.gradle.kts"
          if [ -f "$plugin_file" ]; then
            sed -i '/org.gradle.toolchains.foojay-resolver-convention/s/^/\/\/ /' "$plugin_file"
          fi

      - name: Configure Android SDK path
        run: |
          printf "sdk.dir=%s\n" "$ANDROID_SDK_ROOT" > android/local.properties
          chmod +x android/gradlew
          chmod +x scripts/build-android-release.sh

      - name: Materialize Android release keystore
        id: keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "ANDROID_UPLOAD_KEYSTORE_BASE64 secret is not configured" >&2
            exit 1
          fi

          KEYSTORE_PATH="${GITHUB_WORKSPACE}/android/app/aline2-release.keystore"
          mkdir -p "$(dirname "$KEYSTORE_PATH")"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 -d > "$KEYSTORE_PATH"
          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Validate Android signing configuration
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ vars.ANDROID_UPLOAD_KEY_ALIAS != '' && vars.ANDROID_UPLOAD_KEY_ALIAS || secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          required_signing_values=(
            ANDROID_UPLOAD_STORE_PASSWORD
            ANDROID_UPLOAD_KEY_ALIAS
            ANDROID_UPLOAD_KEY_PASSWORD
          )
          for key in "${required_signing_values[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing Android signing configuration: ${key}" >&2
              exit 1
            fi
          done

      - name: Build release APK
        env:
          ENVFILE_VALUE: ${{ steps.prepare_env.outputs.envfile }}
          ANDROID_UPLOAD_STORE_FILE: ${{ steps.keystore.outputs.keystore_path }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ vars.ANDROID_UPLOAD_KEY_ALIAS != '' && vars.ANDROID_UPLOAD_KEY_ALIAS || secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          echo "Building Android release APK with ${ENVFILE_VALUE} using mode ${{ steps.meta.outputs.apk_mode }}"
          ENVFILE="$ENVFILE_VALUE" ./scripts/build-android-release.sh "${{ steps.meta.outputs.apk_mode }}"

      - name: Build release AAB
        if: steps.meta.outputs.build_aab == 'true'
        env:
          ENVFILE_VALUE: ${{ steps.prepare_env.outputs.envfile }}
          ANDROID_UPLOAD_STORE_FILE: ${{ steps.keystore.outputs.keystore_path }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ vars.ANDROID_UPLOAD_KEY_ALIAS != '' && vars.ANDROID_UPLOAD_KEY_ALIAS || secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          echo "Building Android release AAB with ${ENVFILE_VALUE}"
          ENVFILE="$ENVFILE_VALUE" ./scripts/build-android-release.sh aab
      - name: Clean intermediate build files to reclaim disk space
        run: |
          rm -rf android/app/build/intermediates/transforms || true
          rm -rf android/app/build/intermediates/incremental || true
          df -h

      - name: Collect release artifacts
        id: collect
        run: |
          if [ "${{ steps.meta.outputs.release_profile }}" = "arm64" ]; then
            apk_path="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name 'app-arm64-v8a-release.apk' | head -n 1)"
          else
            apk_path="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f \( -name 'app-release.apk' -o -name '*universal*.apk' \) | sort | head -n 1)"
            if [ -z "$apk_path" ]; then
              apk_path="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
            fi
          fi
          if [ -z "$apk_path" ]; then
            echo "Release APK not found" >&2
            exit 1
          fi
          cp "$apk_path" "${{ steps.meta.outputs.apk_name }}"
          sha256sum "${{ steps.meta.outputs.apk_name }}" > "${{ steps.meta.outputs.apk_name }}.sha256"
          echo "apk_path=${{ steps.meta.outputs.apk_name }}" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.meta.outputs.build_aab }}" = "true" ]; then
            aab_path="$(find android/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)"
            if [ -z "$aab_path" ]; then
              echo "Release AAB not found" >&2
              exit 1
            fi
            cp "$aab_path" "${{ steps.meta.outputs.aab_name }}"
            sha256sum "${{ steps.meta.outputs.aab_name }}" > "${{ steps.meta.outputs.aab_name }}.sha256"
            echo "aab_path=${{ steps.meta.outputs.aab_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up bundletool
        if: steps.meta.outputs.build_aab == 'true'
        run: |
          curl -fsSL -o /tmp/bundletool.jar https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar
          echo "378b5434cd1378bef6b2bc527b8c7f0ff2584b273830335bce54d6d0813c8584  /tmp/bundletool.jar" | sha256sum --check --strict

      - name: Verify release artifacts
        env:
          ANDROID_UPLOAD_STORE_FILE: ${{ steps.keystore.outputs.keystore_path }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ vars.ANDROID_UPLOAD_KEY_ALIAS != '' && vars.ANDROID_UPLOAD_KEY_ALIAS || secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          build_tools_dir="${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS_VERSION}"
          apksigner_bin="${build_tools_dir}/apksigner"
          if [ ! -x "$apksigner_bin" ]; then
            echo "apksigner not found at $apksigner_bin" >&2
            exit 1
          fi

          "$apksigner_bin" verify --print-certs "${{ steps.collect.outputs.apk_path }}" | tee /tmp/apk-verify.txt
          trusted_sha="$(keytool -exportcert -alias "${ANDROID_UPLOAD_KEY_ALIAS}" -keystore "${ANDROID_UPLOAD_STORE_FILE}" -storepass "${ANDROID_UPLOAD_STORE_PASSWORD}" | openssl x509 -inform der -noout -fingerprint -sha256 | cut -d'=' -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          apk_sha="$(awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}' /tmp/apk-verify.txt | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$trusted_sha" ] || [ -z "$apk_sha" ]; then
            echo "Failed to extract signing certificate fingerprints" >&2
            exit 1
          fi

          expected_sha="$(printf '%s' "$ANDROID_UPLOAD_CERT_SHA256_EXPECTED" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ "$trusted_sha" != "$expected_sha" ]; then
            echo "Configured keystore does not match the Google Play upload certificate" >&2
            exit 1
          fi

          if [ "$apk_sha" != "$trusted_sha" ]; then
            echo "APK signing certificate fingerprint mismatch" >&2
            exit 1
          fi

          if [ "${{ steps.meta.outputs.build_aab }}" = "true" ]; then
            java -jar /tmp/bundletool.jar validate --bundle="${{ steps.collect.outputs.aab_path }}"
            keytool -printcert -jarfile "${{ steps.collect.outputs.aab_path }}" | tee /tmp/aab-verify.txt
            aab_sha="$(awk -F': ' '/SHA256:/ {print $2; exit}' /tmp/aab-verify.txt | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            if [ -z "$aab_sha" ]; then
              echo "Failed to extract AAB signing certificate fingerprint" >&2
              exit 1
            fi
            if [ "$aab_sha" != "$trusted_sha" ]; then
              echo "AAB signing certificate fingerprint mismatch" >&2
              exit 1
            fi
          fi

      - name: Upload standard release artifacts
        if: steps.meta.outputs.build_aab == 'true'
        id: upload_release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: |
            ${{ steps.collect.outputs.apk_path }}
            ${{ steps.collect.outputs.aab_path }}
            ${{ steps.collect.outputs.apk_path }}.sha256
            ${{ steps.collect.outputs.aab_path }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload arm64 release artifact
        if: steps.meta.outputs.build_aab != 'true'
        id: upload_release_arm64
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: |
            ${{ steps.collect.outputs.apk_path }}
            ${{ steps.collect.outputs.apk_path }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Configure AWS credentials
        if: steps.meta.outputs.deliver_release == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload private APK and AAB and generate secure links
        if: steps.meta.outputs.deliver_release == 'true'
        id: private_aab
        env:
          APK_PATH: ${{ steps.collect.outputs.apk_path }}
        run: |
          apk_key="android/private/${{ steps.meta.outputs.release_date }}/${{ steps.meta.outputs.apk_name }}"
          s3_key="android/private/${{ steps.meta.outputs.release_date }}/${{ steps.meta.outputs.aab_name }}"
          aws s3 cp "${APK_PATH}" "s3://${PRIVATE_RELEASES_BUCKET}/${apk_key}" --only-show-errors
          aws s3 cp "${{ steps.collect.outputs.aab_path }}" "s3://${PRIVATE_RELEASES_BUCKET}/${s3_key}" --only-show-errors
          apk_download_url="$(aws s3 presign "s3://${PRIVATE_RELEASES_BUCKET}/${apk_key}" --expires-in 604800)"
          download_url="$(aws s3 presign "s3://${PRIVATE_RELEASES_BUCKET}/${s3_key}" --expires-in 604800)"
          echo "::add-mask::${apk_download_url}"
          echo "::add-mask::${download_url}"
          echo "apk_key=$apk_key" >> "$GITHUB_OUTPUT"
          echo "apk_download_url=$apk_download_url" >> "$GITHUB_OUTPUT"
          echo "s3_key=$s3_key" >> "$GITHUB_OUTPUT"
          echo "download_url=$download_url" >> "$GITHUB_OUTPUT"

      - name: Email private APK and AAB delivery notice
        if: steps.meta.outputs.deliver_release == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: cuboidsoft@gmail.com
          EMAIL_SUBJECT: Aline2 Android release ${{ steps.meta.outputs.release_name }}
          EMAIL_BODY: |
            The latest signed Aline2 Android production release is ready.

            Use the private AAB link for the manual Google Play Console upload.
            Both secure APK and AAB download links expire after seven days.
          RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
          APK_DOWNLOAD_URL: ${{ steps.private_aab.outputs.apk_download_url }}
          AAB_DOWNLOAD_URL: ${{ steps.private_aab.outputs.download_url }}
          APK_ATTACHMENT_PATH: ${{ steps.collect.outputs.apk_path }}
          AAB_ATTACHMENT_PATH: ${{ steps.collect.outputs.aab_path }}
        run: |
          python3 ./scripts/ci/send_release_email.py

      - name: Add build summary
        if: success()
        env:
          APK_NAME: ${{ steps.meta.outputs.apk_name }}
          AAB_NAME: ${{ steps.meta.outputs.aab_name }}
        run: |
          {
            echo "## Android Release"
            echo ""
            echo "- Branch: \`main\`"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Release profile: \`${{ steps.meta.outputs.release_profile }}\`"
            echo "- Release: \`${{ steps.meta.outputs.release_name }}\`"
            echo "- GitHub Actions artifacts: available in this run while signed in to GitHub"
            echo "- APK checksum:"
            cat "${APK_NAME}.sha256"
            if [ "${{ steps.meta.outputs.deliver_release }}" = "true" ]; then
              echo "- Private APK/AAB delivery email sent to \`cuboidsoft@gmail.com\`"
              echo "- Secure links expire after seven days"
              echo "- Google Play upload: manual"
              echo "- AAB checksum:"
              cat "${AAB_NAME}.sha256"
            else
              echo "- Build-only validation completed; Play and production downloads were not changed."
              echo "- Private artifact APK: \`${{ steps.meta.outputs.apk_name }}\`"
              if [ "${{ steps.meta.outputs.build_aab }}" = "true" ]; then
                echo "- Private artifact AAB: \`${{ steps.meta.outputs.aab_name }}\`"
                echo "- AAB checksum:"
                cat "${AAB_NAME}.sha256"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
