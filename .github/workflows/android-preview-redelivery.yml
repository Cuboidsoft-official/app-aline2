name: Android PR Test APK Redelivery

# Publishes a PR test APK that a failed Android PR Test APK run already built.
# The Gradle build is never repeated: the retained pr-preview-input artifact is
# re-signed and published from this workflow. It is deliberately standalone and
# top-level, not called from the reusable preview workflow, because a job inside
# a called workflow cannot see the production environment's RELEASE_AWS_*
# secrets — that is exactly why run 175 signed successfully and then failed at
# the publish step. A top-level job bound to `environment: production` resolves
# them (the release workflow proves it on every run).

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged same-repository PR whose test APK run failed after building
        required: true
        type: string
      source_run_id:
        description: Failed Android PR Test APK run that still retains pr-preview-input
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-pr-test-redelivery-${{ inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      pull-requests: read
      actions: read
    outputs:
      pr: ${{ steps.target.outputs.pr }}
      sha: ${{ steps.target.outputs.sha }}
      pr_head_sha: ${{ steps.target.outputs.pr_head_sha }}
      merged: ${{ steps.target.outputs.merged }}
      version: ${{ steps.target.outputs.version }}
      source_run_id: ${{ steps.target.outputs.source_run_id }}
    steps:
      - name: Check out trusted delivery tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Authorize redelivery from the retained build
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 scripts/ci/resolve_preview_redelivery.py

  deliver:
    needs: [resolve]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      # No PR scripts execute in this signing/delivery runner.
      - name: Check out trusted delivery tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download retained built APK from the source run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pr-preview-input
          path: preview
          run-id: ${{ needs.resolve.outputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android verification tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: build-tools;36.0.0
      - name: Verify input APK
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          test -f preview/input.apk
          test ! -L preview/input.apk
          python3 scripts/ci/verify_apk.py preview/input.apk \
            --tools "$ANDROID_SDK_ROOT/build-tools/36.0.0" --version-code "$VERSION"
      - name: Sign and verify test APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          KEY_ALIAS: ${{ vars.ANDROID_UPLOAD_KEY_ALIAS != '' && vars.ANDROID_UPLOAD_KEY_ALIAS || secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/upload.keystore"' EXIT
          printf '%s' "$KEYSTORE" | tr -d '\r\n\t ' | base64 -d > "$RUNNER_TEMP/upload.keystore"
          chmod 600 "$RUNNER_TEMP/upload.keystore"
          tools="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/upload.keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out preview/Aline2-PR-test.apk preview/input.apk
          cert="$("$tools/apksigner" verify --print-certs preview/Aline2-PR-test.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test "$cert" = '34553881d7a4065708f8c871b4d477919a046afdd73c06b5611adf0475132999'
          python3 scripts/ci/verify_apk.py preview/Aline2-PR-test.apk --tools "$tools" --version-code "$VERSION"
          cd preview
          sha256sum Aline2-PR-test.apk > Aline2-PR-test.apk.sha256
      - name: Publish downloads in PR and run summary
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.resolve.outputs.pr }}
          SHA: ${{ needs.resolve.outputs.sha }}
          PR_HEAD_SHA: ${{ needs.resolve.outputs.pr_head_sha }}
          MERGED: ${{ needs.resolve.outputs.merged }}
          VERSION: ${{ needs.resolve.outputs.version }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          PRIVATE_RELEASES_BUCKET: ${{ vars.PRIVATE_RELEASES_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.RELEASE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_AWS_SECRET_ACCESS_KEY }}
        run: python3 scripts/ci/publish_preview.py
      - name: Remove delivered temporary signing input
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ needs.resolve.outputs.source_run_id }}
        run: python3 scripts/ci/cleanup_preview_input.py
