name: Android CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reject sensitive mobile files
        run: bash scripts/ci/check-no-sensitive-mobile-files.sh

      - name: Test release delivery email
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint baseline
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Record existing lint debt
        if: always() && steps.lint.outcome == 'failure'
        run: |
          {
            echo "## Lint debt"
            echo
            echo "Lint remains advisory until the existing application errors are resolved."
            echo "Type checking, tests, and the native Android build remain blocking."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests
        run: npm test -- --runInBand

      - name: Prepare non-production build environment
        run: cp .env.development.example .env.ci

      - name: Patch React Native Gradle resolver for CI
        run: |
          plugin_file="node_modules/@react-native/gradle-plugin/settings.gradle.kts"
          if [ -f "$plugin_file" ]; then
            sed -i '/org.gradle.toolchains.foojay-resolver-convention/s/^/\/\/ /' "$plugin_file"
          fi

      - name: Build unsigned debug APK
        env:
          ENVFILE: .env.ci
          ORG_GRADLE_PROJECT_newArchEnabled: "true"
        run: |
          printf "sdk.dir=%s\n" "$ANDROID_SDK_ROOT" > android/local.properties
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --console=plain \
            --max-workers=2
