name: Android CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # A malformed or unsafe workflow does not fail loudly: GitHub simply does not
  # run it, so a broken release pipeline looks exactly like a quiet week. That
  # is the same failure mode as the dead delivery links, and it gets its own
  # job so it costs seconds instead of sharing the Android build's runtime.
  #
  # actionlint is fetched as a pinned release binary and its checksum verified
  # against the upstream signed sums file, rather than added as a third-party
  # action, so the only new supply-chain surface is one versioned tarball.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.7
        run: |
          set -euo pipefail
          # The upstream asset is named linux_amd64, not linux_x86_64; verified
          # against the v1.7.7 release rather than assumed.
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl --silent --show-error --location --fail --proto '=https' --tlsv1.2 \
            --output "$archive" "${base}/${archive}"
          curl --silent --show-error --location --fail --proto '=https' --tlsv1.2 \
            --output checksums.txt "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          # Verified before unpacking, so a tampered archive never reaches tar.
          grep " ${archive}\$" checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" actionlint
          ./actionlint -version
          ./actionlint .github/workflows/*.yml

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reject sensitive mobile files
        run: bash scripts/ci/check-no-sensitive-mobile-files.sh

      # Release delivery is what actually reaches the client, and it is entirely
      # workflow-driven, so the workflows are code under test. This runs before
      # the expensive Android setup so a broken delivery contract fails in
      # seconds rather than after a 30-minute Gradle build.
      - name: Assert release delivery contract
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v

      - name: Check release helper scripts parse
        run: |
          bash -n scripts/ci/rotate-android-release-credential.sh
          python3 -m py_compile scripts/ci/send_release_email.py

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint baseline
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Record existing lint debt
        if: always() && steps.lint.outcome == 'failure'
        run: |
          {
            echo "## Lint debt"
            echo
            echo "Lint remains advisory until the existing application errors are resolved."
            echo "Type checking, tests, and the native Android build remain blocking."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests
        run: npm test -- --runInBand

      - name: Prepare non-production build environment
        run: cp .env.development.example .env.ci

      - name: Patch React Native Gradle resolver for CI
        run: |
          plugin_file="node_modules/@react-native/gradle-plugin/settings.gradle.kts"
          if [ -f "$plugin_file" ]; then
            sed -i '/org.gradle.toolchains.foojay-resolver-convention/s/^/\/\/ /' "$plugin_file"
          fi

      - name: Build unsigned debug APK
        env:
          ENVFILE: .env.ci
          ORG_GRADLE_PROJECT_newArchEnabled: "true"
        run: |
          printf "sdk.dir=%s\n" "$ANDROID_SDK_ROOT" > android/local.properties
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --console=plain \
            --max-workers=2
